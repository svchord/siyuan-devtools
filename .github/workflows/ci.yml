name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Windows 必须进矩阵：命令层用 spawnSync 调 playwright-cli，
        # 路径分隔符与进程退出码在两端行为不同。
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build

      # 产物冒烟：这些命令不需要浏览器，能验证编译后的 import 路径、
      # shebang 与 bin 入口都是可运行的（tsc 通过不等于 dist 能跑）。
      - name: Smoke test built CLI
        shell: bash
        run: |
          node dist/cli.js --help > /dev/null
          node dist/cli.js read contrast '#000' '#fff' --json
          # 错误路径：未知命令必须以 2 退出、且只打一行（不带堆栈）。
          set +e
          out=$(node dist/cli.js teleport 2>&1)
          code=$?
          set -e
          [ "$code" -eq 2 ] || { echo "期望退出码 2，实际 $code"; exit 1; }
          [ "$(echo "$out" | wc -l)" -eq 1 ] || { echo "错误输出应只有一行：$out"; exit 1; }
          # oklch 不能被当成裸三元组算出一个错值。
          # 断言对紧凑与缩进两种 JSON 都成立（`"ratio":null` / `"ratio": null`），
          # 这样落后于 main 的分支（例如 release-please 的发布分支）也不会误报。
          node dist/cli.js read contrast 'oklch(0.7 0.1 200)' '#fff' --json | grep -Eq '"ratio": ?null'
          node dist/cli.js read contrast '#000' '#fff' --pretty | grep -Eq '"ratio": ?21'

      # 安装态冒烟：上面那步在仓库里跑，仓库的 node_modules 布局和用户装下来
      # 的不一样。曾经 cliPath() 用 require.resolve('playwright-core/cli.js')，
      # 仓库里恰好能解析到，装成依赖后必然失败（playwright-core 的 exports
      # 没有导出 ./cli.js）。这里打 tarball 装进空目录再跑，才能覆盖真实布局。
      #
      # 只在 Linux 跑：查的是 npm 的安装布局，与操作系统无关；而 Windows 上
      # `shell: bash` 是 Git Bash，$RUNNER_TEMP 是 `D:\a\_temp` 这种 Windows
      # 路径，混用会解析失败。Windows 的行为差异由上面的测试矩阵覆盖。
      - name: Smoke test installed package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          pkg=$(npm pack --pack-destination "$RUNNER_TEMP" --silent | tail -n 1)
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP/$pkg" --no-audit --no-fund > /dev/null
          # status 不需要浏览器，但会走 cliPath() 定位 playwright-core cli。
          # 注意：没有 .playwright 目录时 sessionExists() 直接返回 false，
          # 根本不会 spawn playwright-cli —— 那样这条冒烟就测不到 cliPath()。
          # 先建出 workspace 标记，才会真的走到定位逻辑。
          mkdir -p .playwright
          node node_modules/siyuan-devtools/dist/cli.js status --json
